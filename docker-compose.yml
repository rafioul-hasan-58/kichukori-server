services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kichu-kori-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-5000}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
